# Publish the site to GitHub Pages. The deployed tree is `nix build
# .#site`; this job builds and uploads it.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions",
# and the custom domain in site/CNAME pointed at GitHub's servers.
name: pages

on:
  push:
    branches: [main]
    paths:
      - site/**
      - src/**
      - docs/**
      - README.md
      - nix/**
      - tools/build-site.sh
      - tools/render-docs.py
      - flake.lock
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A newer push supersedes an in-flight deploy.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Build the site
        # The pages artifact needs a plain writable directory, not the
        # read-only store output.
        run: |
          nix build .#site -L
          cp -rL result _site
          chmod -R u+w _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
