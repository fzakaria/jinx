# Formatting, then `nix flake check`, all offline:
#
#   checks.build        the compiler type-checks and installs
#   checks.prose        tools/check-prose.py over the tree
#   checks.unit         the node:test suites against recorded cases
#   checks.corpus       tests/corpus/*.nix against the recorded nix output
#   checks.conformance  nix-conformance through the adapter, against the
#                       floor in tests/conformance/expected.json
#
# Then the live differential against the nix on the runner
# (JINX_NIX_DIFF=1), which catches recordings drifting when nix changes.
#
# The whole-nixpkgs parity run needs hours of cores and runs on its own
# machine (docs/verification.md, tools/parity.sh).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Formatting
        run: nix fmt -- --ci

      - name: Checks
        run: nix flake check -L

      - name: Live differential against nix
        run: nix develop -c env JINX_NIX_DIFF=1 npm test

      - name: Corpus against nix-instantiate
        run: nix develop -c npm run corpus
